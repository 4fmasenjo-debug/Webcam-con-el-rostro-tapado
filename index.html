<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Detection with SVG Polygons</title>
  <script defer src="./face-api.js"></script>
  <script defer src="./script.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    video,
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    #svg-container {
      display: none;
    }
  </style>
</head>
<body>
  <video
    id="video"
    width="640"
    height="480"
    autoplay
    muted
    playsinline
    style="position: absolute; top: 0; left: 0;">
  </video>
</body>
</html>
